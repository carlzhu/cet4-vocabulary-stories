<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CET-4 单词打字游戏 · Vocabulary Typing</title>
<style>
  :root {
    --bg: #0b2032; --panel: #123050; --panel2: #0f2740; --line: #2b5580;
    --ink: #eaf2f8; --dim: #9db8ce; --accent: #5fc7e8; --good: #56d38a;
    --bad: #ef7d7d; --key: #f2c14e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  .hidden { display: none !important; }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }

  .hud { position: absolute; inset: 0 0 auto 0; display: flex; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; background: linear-gradient(#0b2032ee, #0b203200);
    font-size: 13px; pointer-events: none; }
  .hud b { color: var(--accent); font-weight: 600; }
  .hud .grow { flex: 1; }
  .hud .where { color: var(--key); }

  .typing { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 18px;
    background: linear-gradient(#0b203200, #0b2032f2 40%); pointer-events: none; }
  #typed { font-family: "Consolas", ui-monospace, monospace; font-size: 30px; letter-spacing: 2px;
    min-height: 40px; color: var(--accent); }
  #typed .rest { color: #4d7ba6; }
  #hint { font-size: 13px; color: var(--dim); min-height: 20px; margin-top: 2px; }
  #hint .m { color: var(--good); }
  #hint .key { color: var(--key); font-weight: 600; }

  .panel { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: #061522e6; padding: 14px; }
  .card { width: min(820px, 95vw); max-height: 94vh; overflow: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .card h1 { font-size: 20px; margin: 0 0 3px; }
  .card h2 { font-size: 14px; margin: 13px 0 6px; color: var(--accent); font-weight: 600; }
  .card p { color: var(--dim); font-size: 12.5px; line-height: 1.6; margin: 5px 0; }
  .row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin: 7px 0; }

  button, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1c6f96; border-color: #2f8fbb; font-weight: 600; padding: 9px 20px; }
  button.on { background: #1c6f96; border-color: var(--accent); }
  button.tab { padding: 6px 10px; font-size: 12px; }

  .arcs, .chapters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chapters { margin-top: 7px; }
  button.chip { padding: 5px 8px; font-size: 12px; line-height: 1.3; text-align: left;
    min-width: 92px; }
  button.chip i { display: block; font-style: normal; font-size: 11px; color: var(--dim); }
  button.chip.on i { color: #cfe9f7; }
  button.chip b { color: var(--key); font-weight: 600; }

  .detail { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; margin-top: 8px; }
  .detail .title { font-size: 14px; font-weight: 600; }
  .detail .meta { font-size: 12px; color: var(--dim); margin-top: 3px; line-height: 1.6; }
  .detail .meta em { font-style: normal; color: var(--key); }
  .preview { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .preview span { background: #14324e; border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 8px; font-size: 12px; font-family: "Consolas", monospace; }
  .preview span.more { color: var(--dim); border-style: dashed; }

  .scope button { min-width: 150px; text-align: left; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(94px, 1fr)); gap: 9px;
    margin-top: 13px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; }
  .stat .k { font-size: 11px; color: var(--dim); }
  .stat .v { font-size: 20px; font-weight: 600; }
  .review { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
  .review span { background: #3a1f26; border: 1px solid #7a3f4a; border-radius: 7px;
    padding: 4px 9px; font-size: 13px; }
  .review span i { color: var(--dim); font-style: normal; font-size: 12px; margin-left: 6px; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font-size: 12px; font-family: inherit; }
  .foot { margin-top: 14px; font-size: 12px; color: #7f9ab1; border-top: 1px solid var(--line);
    padding-top: 9px; line-height: 1.7; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="board"></canvas>

  <div class="hud">
    <span class="where" id="hud-where">—</span>
    <span>得分 <b id="hud-score">0</b></span>
    <span>生命 <b id="hud-lives">3</b></span>
    <span>等级 <b id="hud-level">1</b></span>
    <span>连击 <b id="hud-combo">0</b></span>
    <span>速度 <b id="hud-wpm">0</b> 词/分</span>
    <span>准确率 <b id="hud-acc">100%</b></span>
    <span class="grow"></span>
    <span>剩余 <b id="hud-left">0</b></span>
    <span id="hud-pause">空格暂停 · Esc 设置</span>
  </div>

  <div class="typing">
    <div id="typed"></div>
    <div id="hint"></div>
  </div>

  <div class="panel" id="start-panel">
    <div class="card">
      <h1>CET-4 单词打字游戏</h1>
      <p>先选课，再练这一课的词。默认只练本课<em style="color:#f2c14e;font-style:normal">重点词</em>——
         该课里最长、最难拼的那些；想练全部 45 个词也行。</p>

      <h2>1. 选择章节</h2>
      <div class="arcs" id="arc-row"></div>
      <div class="chapters" id="chapter-row"></div>
      <div class="detail" id="chapter-detail"></div>

      <h2>2. 练习范围</h2>
      <div class="row scope" id="scope-row">
        <button data-scope="key">本课重点词</button>
        <button data-scope="chapter">本课全部词</button>
        <button data-scope="arc">本弧全部词</button>
        <button data-scope="all">全部词表</button>
      </div>

      <h2>3. 难度</h2>
      <div class="row">
        <select id="difficulty">
          <option value="0.85">轻松</option>
          <option value="1" selected>标准</option>
          <option value="1.25">较快</option>
          <option value="1.6">挑战</option>
        </select>
        <select id="mode-select">
          <option value="word" selected>单词模式</option>
          <option value="letter">字母模式（热身）</option>
        </select>
        <button id="btn-start" class="primary">开始练习</button>
      </div>
      <p>操作：直接打字 · <kbd>空格</kbd> 暂停 · <kbd>Esc</kbd> 回到设置 · 结束页可 <kbd>R</kbd> 重开。
         提示条显示当前词的音标与释义，★ 表示本课重点词；落到底部的词记入「要复习的词」。</p>
      <div class="foot" id="foot-note"></div>
    </div>
  </div>

  <div class="panel hidden" id="over-panel">
    <div class="card">
      <h1 id="over-title">练习结束</h1>
      <p id="over-sub"></p>
      <div class="stats">
        <div class="stat"><div class="k">得分</div><div class="v" id="ov-score">0</div></div>
        <div class="stat"><div class="k">击落</div><div class="v" id="ov-cleared">0</div></div>
        <div class="stat"><div class="k">速度</div><div class="v" id="ov-wpm">0</div></div>
        <div class="stat"><div class="k">准确率</div><div class="v" id="ov-acc">0%</div></div>
        <div class="stat"><div class="k">最高连击</div><div class="v" id="ov-combo">0</div></div>
        <div class="stat"><div class="k">本课重点词</div><div class="v" id="ov-key">0</div></div>
      </div>
      <div id="review-block" class="hidden">
        <h2>要复习的词</h2>
        <div class="review" id="review-list"></div>
      </div>
      <div class="row" style="margin-top:15px">
        <button id="btn-prev">← 上一课</button>
        <button id="btn-again" class="primary">再练一次</button>
        <button id="btn-next">下一课 →</button>
        <button id="btn-setup">回到设置</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("word-data").textContent);
const WORDS = DATA.words;
const CHAPTERS = DATA.chapters;
const STORE_KEY = "cet4-typing-game";

/* ---------- pure core: no DOM, so a test can drive it directly ---------- */
const Core = {
  /* Which falling word does the buffer belong to? The lowest match wins, because that
     is the word about to hit the floor and therefore the one worth resolving first. */
  match(words, buffer) {
    if (!buffer) return null;
    const key = buffer.toLowerCase();
    let best = null;
    for (const word of words) {
      if (word.dead) continue;
      if (word.text.toLowerCase().startsWith(key) && (!best || word.y > best.y)) best = word;
    }
    return best;
  },
  /* Resolve one keystroke into a new buffer. A wrong letter does not leave the buffer
     stuck: it is cleared and the letter is retried as the start of a new word, which is
     what makes a typing game feel responsive. */
  keystroke(words, buffer, char) {
    const hit = Core.match(words, buffer + char);
    if (hit) return { buffer: buffer + char, matches: hit, restarted: false };
    const single = Core.match(words, char);
    if (single) return { buffer: char, matches: single, restarted: buffer.length > 0 };
    return { buffer: "", matches: null, restarted: false };
  },
  /* The words a round draws from.
     'key'      the chapter's key words; if that is thinner than `floor`, top up with the
                chapter's remaining words. The data is already ordered key-first and
                longest-first, so the top-up naturally takes the next hardest words.
     'chapter'  every word the chapter introduces
     'arc'      every word in the arc
     'all'      the whole list */
  poolFor(words, scope, chapter, arc, floor) {
    if (scope === "all") return words.slice();
    if (scope === "arc") return words.filter((w) => w.a === arc);
    const inChapter = words.filter((w) => w.c === chapter);
    if (scope === "chapter") return inChapter;
    const keys = inChapter.filter((w) => w.k);
    if (keys.length >= floor) return keys;
    return inChapter.slice(0, Math.max(floor, keys.length));
  },
  speedFor(level, base) { return (26 + level * 7) * base; },
  spawnFor(level) { return Math.max(0.8, 2.6 - level * 0.16); },
  levelFor(cleared) { return 1 + Math.floor(cleared / 10); },
  scoreFor(text, combo) { return (10 + text.length * 2) * (1 + Math.min(combo, 10) * 0.1); },
  shuffle(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  },
};

const board = document.getElementById("board");
const ctx = board.getContext("2d");
const el = (id) => document.getElementById(id);
const LETTERS = "abcdefghijklmnopqrstuvwxyz";
const chapterOf = (n) => CHAPTERS[n - 1];

const state = {
  scope: "key", chapter: 1, arc: 1, difficulty: 1, mode: "word",
  running: false, paused: false, over: true,
  pool: [], queue: [], falling: [],
  buffer: "", active: null,
  lives: 3, score: 0, combo: 0, bestCombo: 0, cleared: 0, level: 1, keyCleared: 0,
  review: [], keystrokes: 0, goodKeystrokes: 0,
  startedAt: 0, elapsed: 0, spawnTimer: 0.3, lastFrame: 0, hudTimer: 0,
  width: 0, height: 0, dpr: 1, animating: false,
};

/* ---------- layout ---------- */
function resize() {
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);
  state.width = board.clientWidth || window.innerWidth;
  state.height = board.clientHeight || window.innerHeight;
  board.width = Math.floor(state.width * state.dpr);
  board.height = Math.floor(state.height * state.dpr);
  ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
}
window.addEventListener("resize", resize);

/* ---------- the words this round will use ---------- */
function currentPool() {
  if (state.mode === "letter") return [];
  return Core.poolFor(WORDS, state.scope, state.chapter, state.arc, DATA.key_floor);
}

function scopeLabel() {
  if (state.mode === "letter") return "字母模式";
  if (state.scope === "all") return `全部词表 ${WORDS.length} 词`;
  if (state.scope === "arc") return `第 ${state.arc} 弧`;
  const chapter = chapterOf(state.chapter);
  const prefix = `CH${String(state.chapter).padStart(3, "0")} ${chapter.t}`;
  return state.scope === "key" ? `${prefix} · 重点词` : `${prefix} · 全部词`;
}

/* ---------- setup screen ---------- */
function remember() {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify({
      chapter: state.chapter, arc: state.arc, scope: state.scope,
      difficulty: state.difficulty, mode: state.mode,
    }));
  } catch (error) { /* private mode: remembering is a convenience, not a requirement */ }
}

function restore() {
  let saved = null;
  try { saved = JSON.parse(window.localStorage.getItem(STORE_KEY) || "null"); } catch (error) { saved = null; }
  if (saved && Number.isInteger(saved.chapter) && saved.chapter >= 1 && saved.chapter <= CHAPTERS.length) {
    state.chapter = saved.chapter;
    state.arc = saved.arc || chapterOf(state.chapter).a;
    state.scope = saved.scope || "key";
    state.difficulty = saved.difficulty || 1;
    state.mode = saved.mode || "word";
  }
  /* #ch068 makes a chapter linkable - useful when the point is "practise this chapter". */
  const hash = /^#ch(\d{1,3})$/i.exec(window.location.hash || "");
  if (hash) {
    const wanted = Number(hash[1]);
    if (wanted >= 1 && wanted <= CHAPTERS.length) {
      state.chapter = wanted;
      state.arc = chapterOf(wanted).a;
    }
  }
  state.arc = chapterOf(state.chapter).a;
}

function renderArcs() {
  const row = el("arc-row");
  row.innerHTML = "";
  const arcs = [...new Set(CHAPTERS.map((c) => c.a))].sort((a, b) => a - b);
  for (const arc of arcs) {
    const button = document.createElement("button");
    button.className = "tab" + (arc === state.arc ? " on" : "");
    button.textContent = `第 ${arc} 弧`;
    button.addEventListener("click", () => {
      state.arc = arc;
      const first = CHAPTERS.find((c) => c.a === arc);
      if (first) state.chapter = first.n;
      renderSetup();
    });
    row.appendChild(button);
  }
}

function renderChapters() {
  const row = el("chapter-row");
  row.innerHTML = "";
  for (const chapter of CHAPTERS.filter((c) => c.a === state.arc)) {
    const button = document.createElement("button");
    button.className = "chip" + (chapter.n === state.chapter ? " on" : "");
    button.innerHTML = "";
    const head = document.createElement("span");
    head.textContent = `CH${String(chapter.n).padStart(3, "0")} `;
    const key = document.createElement("b");
    key.textContent = `★${chapter.kn}`;
    const title = document.createElement("i");
    title.textContent = chapter.t;
    button.append(head, key, title);
    button.addEventListener("click", () => {
      state.chapter = chapter.n;
      renderSetup();
    });
    row.appendChild(button);
  }
}

function renderDetail() {
  const chapter = chapterOf(state.chapter);
  const total = Core.poolFor(WORDS, "chapter", state.chapter, state.arc, 0).length;
  const keys = Core.poolFor(WORDS, "key", state.chapter, state.arc, DATA.key_floor).length;
  const detail = el("chapter-detail");
  detail.innerHTML = "";
  const title = document.createElement("div");
  title.className = "title";
  title.textContent = `CH${String(chapter.n).padStart(3, "0")} ${chapter.t} · ${chapter.z}`;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `主题：${chapter.m}　本课词汇 ${total} 个，其中重点词 ${keys} 个`;
  const preview = document.createElement("div");
  preview.className = "preview";
  const shown = WORDS.filter((w) => w.c === state.chapter && w.k).slice(0, 9);
  for (const word of shown) {
    const chip = document.createElement("span");
    chip.textContent = word.w;
    preview.appendChild(chip);
  }
  if (keys > shown.length) {
    const more = document.createElement("span");
    more.className = "more";
    more.textContent = `还有 ${keys - shown.length} 个`;
    preview.appendChild(more);
  }
  detail.append(title, meta, preview);
}

function renderScope() {
  for (const button of el("scope-row").querySelectorAll("button")) {
    const scope = button.dataset.scope;
    const on = scope === state.scope;
    button.classList.toggle("on", on);
    let count = WORDS.length;
    if (scope === "key") count = Core.poolFor(WORDS, "key", state.chapter, state.arc, DATA.key_floor).length;
    else if (scope === "chapter") count = Core.poolFor(WORDS, "chapter", state.chapter, state.arc, 0).length;
    else if (scope === "arc") count = WORDS.filter((w) => w.a === state.arc).length;
    const label = { key: "本课重点词", chapter: "本课全部词", arc: "本弧全部词", all: "全部词表" }[scope];
    button.textContent = `${label}（${count}）`;
  }
}

function renderSetup() {
  renderArcs();
  renderChapters();
  renderDetail();
  renderScope();
  el("difficulty").value = String(state.difficulty);
  el("mode-select").value = state.mode;
  // Keep the in-game header honest when the chapter changes on the setup screen.
  el("hud-where").textContent = state.running || state.over ? scopeLabel() : "—";
  el("foot-note").textContent =
    `词表与释义取自本仓库 vocabulary_master.csv，按 curriculum_plan.csv 归入各课。`
    + `重点词定义：${DATA.key_rule}，共 ${DATA.key_total} 个；`
    + `本课重点词不足 ${DATA.key_floor} 个时用本课最长的词补足。`
    + `本页是单文件，双击即可离线使用。`;
  remember();
}

/* ---------- flow ---------- */
function start() {
  state.pool = currentPool();
  if (state.mode === "word" && !state.pool.length) {
    window.alert("这个范围没有词，请换一个范围。");
    return;
  }
  state.queue = state.mode === "letter" ? [] : Core.shuffle(state.pool);
  state.falling = [];
  state.buffer = "";
  state.active = null;
  state.running = true;
  state.paused = false;
  state.over = false;
  state.lives = 3;
  state.score = 0;
  state.combo = 0;
  state.bestCombo = 0;
  state.cleared = 0;
  state.level = 1;
  state.keyCleared = 0;
  state.review = [];
  state.keystrokes = 0;
  state.goodKeystrokes = 0;
  state.elapsed = 0;
  state.spawnTimer = 0.3;
  state.startedAt = performance.now();
  state.lastFrame = performance.now();
  el("start-panel").classList.add("hidden");
  el("over-panel").classList.add("hidden");
  remember();
  updateHud(true);
  if (!state.animating) { state.animating = true; requestAnimationFrame(loop); }
}

function remaining() {
  if (state.mode === "letter") return "—";
  return String(state.queue.length + state.falling.filter((w) => !w.dead).length);
}

function spawn() {
  let entry;
  if (state.mode === "letter") {
    entry = { w: LETTERS[Math.floor(Math.random() * LETTERS.length)], p: "", m: "", k: 0 };
  } else {
    if (!state.queue.length) return false;
    entry = state.queue.shift();
  }
  ctx.font = '600 26px Consolas, ui-monospace, monospace';
  const width = ctx.measureText(entry.w).width;
  const margin = 80;
  const span = Math.max(40, state.width - margin * 2 - width);
  state.falling.push({
    text: entry.w, phonetic: entry.p || "", meaning: entry.m || "", key: entry.k || 0,
    x: margin + Math.random() * span, y: -16,
    speed: Core.speedFor(state.level, state.difficulty), dead: false,
  });
  return true;
}

function finish() {
  state.over = true;
  state.running = false;
  const minutes = Math.max(state.elapsed / 60000, 1 / 60);
  const wpm = Math.round(state.cleared / minutes);
  const acc = state.keystrokes ? Math.round((state.goodKeystrokes / state.keystrokes) * 100) : 100;
  el("over-title").textContent = state.lives > 0 ? "这一轮练完了" : "生命用尽";
  el("over-sub").textContent = state.lives > 0
    ? `${scopeLabel()} 的词都出现过一遍了。可以接着练下一课，或再练一轮。`
    : `有词落到了底部。下面列出的词值得再练一轮。`;
  el("ov-score").textContent = String(Math.round(state.score));
  el("ov-cleared").textContent = String(state.cleared);
  el("ov-wpm").textContent = String(wpm);
  el("ov-acc").textContent = acc + "%";
  el("ov-combo").textContent = String(state.bestCombo);
  el("ov-key").textContent = String(state.keyCleared);
  const list = el("review-list");
  list.innerHTML = "";
  if (state.review.length) {
    el("review-block").classList.remove("hidden");
    for (const word of state.review.slice(0, 40)) {
      const span = document.createElement("span");
      span.textContent = word.text;
      if (word.meaning) {
        const note = document.createElement("i");
        note.textContent = word.meaning;
        span.appendChild(note);
      }
      list.appendChild(span);
    }
  } else {
    el("review-block").classList.add("hidden");
  }
  /* Moving between chapters is only meaningful when a chapter is the unit of practice. */
  const perChapter = state.scope === "key" || state.scope === "chapter";
  el("btn-prev").classList.toggle("hidden", !perChapter || state.chapter <= 1);
  el("btn-next").classList.toggle("hidden", !perChapter || state.chapter >= CHAPTERS.length);
  el("over-panel").classList.remove("hidden");
  updateHud(true);
}

function goToChapter(number) {
  if (number < 1 || number > CHAPTERS.length) return;
  state.chapter = number;
  state.arc = chapterOf(number).a;
  remember();
  renderSetup();
  start();
}

/* ---------- input ---------- */
function handleChar(char) {
  if (!state.running || state.paused) return;
  const result = Core.keystroke(state.falling, state.buffer, char);
  state.keystrokes += 1;
  if (!result.matches) {
    state.buffer = "";
    state.active = null;
    state.combo = 0;
  } else {
    state.goodKeystrokes += 1;
    state.buffer = result.buffer;
    state.active = result.matches;
    if (state.buffer.length >= result.matches.text.length) {
      const word = result.matches;
      word.dead = true;
      state.cleared += 1;
      if (word.key) state.keyCleared += 1;
      state.combo += 1;
      state.bestCombo = Math.max(state.bestCombo, state.combo);
      state.score += Core.scoreFor(word.text, state.combo);
      state.level = Core.levelFor(state.cleared);
      state.buffer = "";
      state.active = null;
    }
  }
  updateHud(true);
}

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    state.running = false;
    state.paused = false;
    state.falling = [];
    state.buffer = "";
    state.active = null;
    el("over-panel").classList.add("hidden");
    el("start-panel").classList.remove("hidden");
    renderSetup();
    updateHud(true);
    return;
  }
  if (event.key === " ") {
    /* 14 entries are phrases - "ice cream", "according to" - so a space has to be
       typeable when it is the next character of the word being typed. Otherwise it
       keeps its usual meaning of pause. */
    const expectsSpace = state.running && !state.paused && state.active
      && state.active.text[state.buffer.length] === " ";
    if (expectsSpace) {
      event.preventDefault();
      handleChar(" ");
      return;
    }
    if (state.running) {
      event.preventDefault();
      state.paused = !state.paused;
      updateHud(true);
    }
    return;
  }
  /* R restarts only when a round is not in progress. During play it has to reach the
     game as an ordinary letter, or a word containing "r" could never be typed. */
  if (!state.running && (event.key === "r" || event.key === "R")) { start(); return; }
  if (event.key.length === 1 && /[A-Za-z'-]/.test(event.key)) {
    event.preventDefault();
    handleChar(event.key);
  }
});

/* ---------- rendering ---------- */
function updateHud(force) {
  el("hud-where").textContent = state.running || state.over ? scopeLabel() : "—";
  el("hud-score").textContent = String(Math.round(state.score));
  el("hud-lives").textContent = String(Math.max(0, state.lives));
  el("hud-level").textContent = String(state.level);
  el("hud-combo").textContent = String(state.combo);
  const minutes = Math.max(state.elapsed / 60000, 1 / 60);
  el("hud-wpm").textContent = state.running ? String(Math.round(state.cleared / minutes)) : "0";
  el("hud-acc").textContent =
    (state.keystrokes ? Math.round((state.goodKeystrokes / state.keystrokes) * 100) : 100) + "%";
  el("hud-left").textContent = remaining();
  el("hud-pause").textContent = state.paused ? "已暂停 · 空格继续" : "空格暂停 · Esc 设置";
  const typed = el("typed");
  typed.innerHTML = "";
  const done = document.createElement("span");
  done.textContent = state.buffer;
  const rest = document.createElement("span");
  rest.className = "rest";
  rest.textContent = state.active && state.active.text.length > state.buffer.length
    ? state.active.text.slice(state.buffer.length) : "";
  typed.append(done, rest);
  const hint = el("hint");
  hint.innerHTML = "";
  if (state.active) {
    if (state.active.key) {
      const badge = document.createElement("span");
      badge.className = "key";
      badge.textContent = "★ 重点词　";
      hint.appendChild(badge);
    }
    if (state.active.phonetic) {
      const ph = document.createElement("span");
      ph.className = "ph";
      ph.textContent = "/" + state.active.phonetic + "/  ";
      hint.appendChild(ph);
    }
    const meaning = document.createElement("span");
    meaning.className = "m";
    meaning.textContent = state.active.meaning || "";
    hint.appendChild(meaning);
  }
}

function draw() {
  ctx.clearRect(0, 0, state.width, state.height);
  const floor = state.height - 92;
  ctx.strokeStyle = "#2b5580";
  ctx.setLineDash([6, 8]);
  ctx.beginPath();
  ctx.moveTo(0, floor);
  ctx.lineTo(state.width, floor);
  ctx.stroke();
  ctx.setLineDash([]);

  for (const word of state.falling) {
    if (word.dead) continue;
    const isActive = Boolean(state.buffer) && word.text.toLowerCase().startsWith(state.buffer.toLowerCase());
    const matched = isActive ? word.text.slice(0, state.buffer.length) : "";
    const restText = word.text.slice(matched.length);
    ctx.font = '600 26px Consolas, ui-monospace, monospace';
    const base = isActive ? "#5fc7e8" : "#eaf2f8";
    const tail = word.y > floor - 60 ? "#ef7d7d" : (isActive ? "#bfe7f5" : "#9db8ce");
    let x = word.x;
    if (matched) {
      ctx.fillStyle = base;
      ctx.fillText(matched, x, word.y);
      x += ctx.measureText(matched).width;
    }
    ctx.fillStyle = tail;
    ctx.fillText(restText, x, word.y);
    /* A star to the left marks a key word, so the screen shows what matters most. */
    if (word.key) {
      ctx.fillStyle = "#f2c14e";
      ctx.font = '600 15px "Segoe UI", sans-serif';
      ctx.fillText("★", word.x - 17, word.y);
    }
    if (isActive && word.phonetic) {
      ctx.font = '400 12px "Segoe UI", sans-serif';
      ctx.fillStyle = "#7f9ab1";
      ctx.fillText("/" + word.phonetic + "/", word.x, word.y + 15);
    }
  }

  if (state.paused) {
    ctx.fillStyle = "#8fb4d0";
    ctx.font = '600 18px "Segoe UI", sans-serif';
    ctx.textAlign = "center";
    ctx.fillText("已暂停 · 按空格继续", state.width / 2, state.height / 2);
    ctx.textAlign = "left";
  }
}

function loop(now) {
  const delta = Math.min((now - state.lastFrame) / 1000, 0.05);
  state.lastFrame = now;
  if (state.running && !state.paused) {
    state.elapsed = now - state.startedAt;
    state.spawnTimer -= delta;
    const interval = Core.spawnFor(state.level);
    if (state.spawnTimer <= 0 && state.falling.filter((w) => !w.dead).length < 8) {
      if (spawn() || state.mode === "letter") state.spawnTimer = interval;
      else state.spawnTimer = 0.25;
    }
    const floor = state.height - 92;
    for (const word of state.falling) {
      if (word.dead) continue;
      word.y += word.speed * delta * 6;
      if (word.y >= floor) {
        word.dead = true;
        state.lives -= 1;
        state.combo = 0;
        if (state.active === word) { state.active = null; state.buffer = ""; }
        if (state.mode !== "letter") state.review.push({ text: word.text, meaning: word.meaning });
        if (state.lives <= 0) { state.falling = state.falling.filter((w) => !w.dead); finish(); return; }
      }
    }
    state.falling = state.falling.filter((word) => !word.dead);
    if (state.mode !== "letter" && !state.queue.length
        && !state.falling.some((w) => !w.dead)) {
      finish();
      return;
    }
    state.hudTimer -= delta;
    if (state.hudTimer <= 0) { state.hudTimer = 0.2; updateHud(false); }
  }
  draw();
  requestAnimationFrame(loop);
}

/* ---------- setup wiring ---------- */
el("scope-row").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-scope]");
  if (!button) return;
  state.scope = button.dataset.scope;
  renderSetup();
});
el("difficulty").addEventListener("change", () => {
  state.difficulty = Number(el("difficulty").value);
  remember();
});
el("mode-select").addEventListener("change", () => {
  state.mode = el("mode-select").value;
  remember();
});
el("btn-start").addEventListener("click", start);
el("btn-again").addEventListener("click", start);
el("btn-prev").addEventListener("click", () => goToChapter(state.chapter - 1));
el("btn-next").addEventListener("click", () => goToChapter(state.chapter + 1));
el("btn-setup").addEventListener("click", () => {
  el("over-panel").classList.add("hidden");
  el("start-panel").classList.remove("hidden");
  renderSetup();
});

restore();
resize();
renderSetup();
updateHud(true);
draw();
</script>
</body>
</html>
